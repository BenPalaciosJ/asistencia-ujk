        .container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 5rem;
            max-width: 1200px;
            padding: 2rem;
        }

        .info-section {

            flex-direction: column;
            align-items: flex-start;
            gap: 1.5rem;

        }

        }

        .date-display {
            font-size: 0.95rem;
            color: #38bdf8;
            text-transform: capitalize;
            font-weight: 500;
        }

        .pin-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .pin-label {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            font-weight: 600;
        }

        .pin-code {
            font-size: 7rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: #38bdf8;
            line-height: 1;
        }

        /* Estilo dinámico cuando no hay PIN asignado */
        .pin-code.no-pin {
            font-size: 2rem;
            color: #f43f5e;
            font-weight: 600;
            line-height: 1.3;
        }

        .qr-section {
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .qr-section:hover {
            transform: scale(1.02);
        }

        #qrcode canvas, #qrcode img {
            display: block;
            border-radius: 0.5rem;
        }

        .qr-hint {
            font-size: 0.85rem;
            color: #334155;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.02em;
        }

        footer {
            position: absolute;
            bottom: 1.5rem;
            font-size: 0.9rem;
            color: #475569;
        }
    </style>

        function verificarPinPorFecha() {
            // Obtener fecha actual en formato YYYY-MM-DD usando la hora local exacta
            const hoy = new Date();
            const anio = hoy.getFullYear();
            const mes = String(hoy.getMonth() + 1).padStart(2, '0');
            const dia = String(hoy.getDate()).padStart(2, '0');
            const fechaHoyStr = `${anio}-${mes}-${dia}`;

            // Mostrar la fecha amigable en pantalla
            const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date-text').innerText = hoy.toLocaleDateString('es-ES', opcionesFecha);

            const pinDisplay = document.getElementById('pin-display');

            // Validar si la fecha local de hoy existe en el objeto
            if (calendarioPines.hasOwnProperty(fechaHoyStr)) {
                pinDisplay.className = "pin-code"; 
                pinDisplay.innerText = calendarioPines[fechaHoyStr];
            } else {
                pinDisplay.className = "pin-code no-pin"; 
                pinDisplay.innerText = "PIN no asignado aún para esta fecha.";
            }
        }
