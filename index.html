<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia - UJK</title>
    <!-- Librería para generar el QR dinámicamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a; color: #f8fafc;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }
        .container { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 5rem; max-width: 1200px; padding: 2rem; }
        .info-section { display: flex; flex-direction: column; align-items: flex-start; gap: 1.5rem; }
        h1 { font-size: 2.2rem; font-weight: 400; color: #94a3b8; letter-spacing: -0.025em; line-height: 1.2; }
        .subtitle { font-size: 1.2rem; color: #64748b; margin-top: 0.3rem; }
        .pin-container { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
        .pin-label { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; font-weight: 600; }
        .pin-code { font-size: 8rem; font-weight: 800; letter-spacing: 0.05em; color: #38bdf8; line-height: 1; }
        .qr-section {
            background: #ffffff; padding: 1.5rem; border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
            text-decoration: none; transition: transform 0.2s ease;
        }
        .qr-section:hover { transform: scale(1.02); }
        #qrcode canvas, #qrcode img { display: block; border-radius: 0.5rem; }
        .qr-hint { font-size: 0.85rem; color: #334155; font-weight: 600; text-align: center; }
        footer { position: absolute; bottom: 1.5rem; font-size: 0.9rem; color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <div class="info-section">
            <div>
                <h1>Registro de Asistencias UJK</h1>
                <div class="subtitle">Educación Continua</div>
            </div>
            <div class="pin-container">
                <span class="pin-label">PIN de la Clase</span>
                <!-- CAMBIA EL PIN AQUÍ DIRECTAMENTE ANTES DE CADA CLASE -->
                <div class="pin-code" id="pin-display">5598</div>
            </div>
        </div>

        <a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=GLuMkMtiv0qNgXNUIBnVib19QUgiNrVPvnvirf5lPohUQVU2WExRWVlMQkY4SUhCOVdIWThONTVGQi4u" target="_blank" class="qr-section">
            <div id="qrcode"></div>
            <span class="qr-hint">Escanea para registrar asistencia</span>
        </a>
    </div>

    <footer>UJK • Sistema de Control de Asistencias</footer>

    <script>
        // Generar QR automáticamente
        new QRCode(document.getElementById("qrcode"), {
            text: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=GLuMkMtiv0qNgXNUIBnVib19QUgiNrVPvnvirf5lPohUQVU2WExRWVlMQkY4SUhCOVdIWThONTVGQi4u",
            width: 240, height: 240, colorDark: "#0f172a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
